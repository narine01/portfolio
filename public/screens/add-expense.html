<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendSense · Add expense</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:'Inter',system-ui,sans-serif}button,input{font-family:inherit}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F6F2; color: #14201B; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 24px 8px 8px 8px">
    <button aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #14201B; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.3px">New expense</div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 8px 20px; display: flex; flex-direction: column; gap: 16px">
    <button style="height: 52px; border-radius: 16px; border: 1.5px solid #0F6B54; background: #DDEFE8; color: #0B5240; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Scan a bill instead
    </button>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-title" style="font-size: 13px; font-weight: 600; color: #5B6B63">Title</label>
      <input id="f-title" value="Cafe Coffee Day" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFD5CF; background: #FFFFFF; font-size: 16px; color: #14201B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-amount" style="font-size: 13px; font-weight: 600; color: #5B6B63">Amount (₹)</label>
      <input id="f-amount" value="310" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFD5CF; background: #FFFFFF; font-size: 16px; color: #14201B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-cat" style="font-size: 13px; font-weight: 600; color: #5B6B63">Category</label>
      <input id="f-cat" value="Food" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFD5CF; background: #FFFFFF; font-size: 16px; color: #14201B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-date" style="font-size: 13px; font-weight: 600; color: #5B6B63">Date</label>
      <input id="f-date" value="9 Nov 2026" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFD5CF; background: #FFFFFF; font-size: 16px; color: #14201B">
    </div>
  </div>

  <div style="display: flex; gap: 12px; padding: 16px 20px 28px 20px">
    <button style="flex: 1; height: 52px; border-radius: 26px; border: 1.5px solid #CFD5CF; background: transparent; color: #14201B; font-size: 16px; font-weight: 600">Cancel</button>
    <button style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: #0F6B54; color: #FFFFFF; font-size: 16px; font-weight: 600">Save</button>
  </div>
</div>
</body>
</html>
