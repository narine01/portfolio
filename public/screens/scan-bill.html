<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendSense · Scan a bill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:'Inter',system-ui,sans-serif}button,input{font-family:inherit}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F6F2; color: #14201B; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 24px 8px 8px 8px">
    <button aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #14201B; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.3px">Scan a bill</div>
  </div>

  <div style="margin: 8px 20px 0 20px; height: 250px; border-radius: 20px; background: #1F2A25; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <div style="width: 150px; height: 220px; box-sizing: border-box; background: #FFFFFF; border-radius: 6px; padding: 16px 14px; display: flex; flex-direction: column; gap: 9px; transform: rotate(-3deg)">
      <div style="height: 10px; width: 60%; background: #14201B; border-radius: 2px; align-self: center"></div>
      <div style="height: 5px; width: 80%; background: #CFD5CF; border-radius: 2px; align-self: center"></div>
      <div style="height: 1px; background: #CFD5CF; margin: 4px 0"></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 50%; background: #9AA59E; border-radius: 2px"></div><div style="height: 6px; width: 20%; background: #9AA59E; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 40%; background: #9AA59E; border-radius: 2px"></div><div style="height: 6px; width: 24%; background: #9AA59E; border-radius: 2px"></div></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 6px; width: 56%; background: #9AA59E; border-radius: 2px"></div><div style="height: 6px; width: 18%; background: #9AA59E; border-radius: 2px"></div></div>
      <div style="height: 1px; background: #CFD5CF; margin: 4px 0"></div>
      <div style="display: flex; justify-content: space-between"><div style="height: 8px; width: 30%; background: #14201B; border-radius: 2px"></div><div style="height: 8px; width: 28%; background: #14201B; border-radius: 2px"></div></div>
    </div>
  </div>

  <div style="margin: 16px 20px 0 20px; padding: 20px; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 15px; font-weight: 600">Extracted by AI</div>
      <div style="font-size: 12px; font-weight: 600; color: #0B5240; background: #DDEFE8; padding: 4px 10px; border-radius: 12px">Review before saving</div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding-bottom: 12px; border-bottom: 1px solid #ECEEE8"><span style="color: #5B6B63">Merchant</span><span style="font-weight: 600">Swiggy</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding-bottom: 12px; border-bottom: 1px solid #ECEEE8"><span style="color: #5B6B63">Amount</span><span style="font-weight: 600">₹450.00</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; padding-bottom: 12px; border-bottom: 1px solid #ECEEE8"><span style="color: #5B6B63">Date</span><span style="font-weight: 600">14 Nov 2026</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #5B6B63">Category</span><span style="font-weight: 600">Food</span></div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; gap: 12px; padding: 16px 20px 28px 20px">
    <button style="flex: 1; height: 52px; border-radius: 26px; border: 1.5px solid #CFD5CF; background: transparent; color: #14201B; font-size: 16px; font-weight: 600">Edit</button>
    <button style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: #0F6B54; color: #FFFFFF; font-size: 16px; font-weight: 600">Save expense</button>
  </div>
</div>
</body>
</html>
