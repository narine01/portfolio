<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendSense · Monthly summary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:'Inter',system-ui,sans-serif}button,input{font-family:inherit}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #F7F6F2; color: #14201B; overflow: hidden">
  <div style="padding: 28px 20px 8px 20px">
    <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Summary</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px">
    <button aria-label="Previous month" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #14201B; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-size: 17px; font-weight: 600">November 2026</div>
    <button aria-label="Next month" disabled style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #A9B2AC; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div style="padding: 4px 20px 16px 20px">
    <div style="font-size: 14px; color: #5B6B63">Total spent</div>
    <div style="font-size: 44px; font-weight: 700; letter-spacing: -1.5px">₹12,840.50</div>
  </div>

  <div style="flex: 1; min-height: 0; margin: 0 16px; padding: 20px; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 15px; font-weight: 600">By category</div>

    <div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Groceries</span><span style="font-weight: 600">₹4,284.50</span></div>
      <div style="margin-top: 8px; height: 10px; border-radius: 5px; background: #ECEEE8"><div style="width: 100%; height: 10px; border-radius: 5px; background: #0F6B54"></div></div>
    </div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Food</span><span style="font-weight: 600">₹3,160.00</span></div>
      <div style="margin-top: 8px; height: 10px; border-radius: 5px; background: #ECEEE8"><div style="width: 74%; height: 10px; border-radius: 5px; background: #0F6B54"></div></div>
    </div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Bills</span><span style="font-weight: 600">₹2,399.00</span></div>
      <div style="margin-top: 8px; height: 10px; border-radius: 5px; background: #ECEEE8"><div style="width: 56%; height: 10px; border-radius: 5px; background: #0F6B54"></div></div>
    </div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Entertainment</span><span style="font-weight: 600">₹1,577.00</span></div>
      <div style="margin-top: 8px; height: 10px; border-radius: 5px; background: #ECEEE8"><div style="width: 37%; height: 10px; border-radius: 5px; background: #0F6B54"></div></div>
    </div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 500">Transport</span><span style="font-weight: 600">₹1,420.00</span></div>
      <div style="margin-top: 8px; height: 10px; border-radius: 5px; background: #ECEEE8"><div style="width: 33%; height: 10px; border-radius: 5px; background: #0F6B54"></div></div>
    </div>
  </div>
  <div style="height: 16px"></div>

  <nav style="height: 72px; display: flex; background: #FFFFFF; border-top: 1px solid #E3E5DF">
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6B63; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>Expenses
    </button>
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0F6B54; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #DDEFE8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 20h18M6 20v-8M12 20V5M18 20v-5"/></svg></span>Summary
    </button>
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6B63; font-size: 12px; font-weight: 500">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>Ask AI
    </button>
  </nav>
</div>
</body>
</html>
